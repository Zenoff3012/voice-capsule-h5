<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA配置 -->
    <link rel="manifest" href="/manifest.json" />
    <!-- 修改: 主题色改为复古红 -->
    <meta name="theme-color" content="#B85450" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 修改: PWA标题 -->
    <meta name="apple-mobile-web-app-title" content="亲声时光贴" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- SEO -->
    <!-- 修改: 页面标题 -->
    <title>亲声时光贴 - 把声音贴进时光里</title>
    <!-- 修改: 描述文案 -->
    <meta name="description" content="录制专属声音时光贴，把声音贴进时光里。为TA制作一份独特的声音明信片，用声音传递跨越时空的心意。" />
    <!-- 修改: 关键词 -->
    <meta name="keywords" content="声音礼物,录音,时光贴,声音明信片,亲声时光贴,怀旧,复古" />
    
    <!-- 微信分享 -->
    <!-- 修改: Open Graph 标题 -->
    <meta property="og:title" content="亲声时光贴 - 把声音贴进时光里" />
    <!-- 修改: Open Graph 描述 -->
    <meta property="og:description" content="有人为你制作了一份声音时光贴，快来听听这段穿越时空的声音留言吧！" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:type" content="website" />
    
    <!-- 禁止缓存（开发阶段） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <style>
      /* 修改: 加载动画样式改为复古风格 */
      .loading-screen {
        position: fixed;
        inset: 0;
        /* 旧纸张背景色 */
        background: linear-gradient(135deg, #F5F0E6 0%, #FDF6E3 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* 修改: Logo样式改为复古收音机风格 */
      .loading-logo {
        width: 80px;
        height: 80px;
        /* 复古红渐变 */
        background: linear-gradient(135deg, #D4A574 0%, #B85450 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: loading-pulse 1.5s ease-in-out infinite;
        /* 添加边框营造立体感 */
        border: 3px solid #8B5A2B;
        box-shadow: 0 4px 0 #5C4033, 0 8px 20px rgba(0,0,0,0.2);
      }
      /* 修改: 文字改为"时" */
      .loading-logo span {
        color: white;
        font-size: 32px;
        font-weight: bold;
        /* 系统衬线字体 */
        font-family: "Source Han Serif SC", "PingFang SC", serif;
      }
      .loading-text {
        margin-top: 20px;
        /* 复古深棕色 */
        color: #5C4033;
        font-size: 14px;
        font-family: "Source Han Serif SC", "PingFang SC", serif;
      }
      @keyframes loading-pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 4px 0 #5C4033, 0 4px 20px rgba(184, 84, 80, 0.3);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 4px 0 #5C4033, 0 8px 30px rgba(184, 84, 80, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <!-- 加载画面 -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-logo">
        <!-- 修改: 从"亲"改为"时" -->
        <span>时</span>
      </div>
      <p class="loading-text">正在加载时光贴...</p>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // 隐藏加载画面
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
              loadingScreen.remove();
            }, 300);
          }
        }, 500);
      });
      
      // 微信浏览器提示
      const isWechat = /MicroMessenger/i.test(navigator.userAgent);
      if (isWechat && !window.location.protocol.includes('https')) {
        console.warn('微信浏览器需要使用HTTPS才能录音');
      }
    </script>
  </body>
</html>
